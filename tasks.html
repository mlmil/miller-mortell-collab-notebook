<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tasks — Mortell-Miller</title>
<style>
  :root {
    --bg: #0E1117; --surface: #161B27; --surface2: #1E2535; --surface3: #252D40;
    --accent: #4A9EDB; --accent-dim: #1D3A57;
    --green: #2ECC71; --green-dim: #0D3320; --green-badge: #163D25;
    --amber: #F0A500; --amber-dim: #3A2800;
    --red: #E05252; --red-dim: #3A1010;
    --border: #2A3248; --text: #E8ECF4; --muted: #E8ECF4; --muted2: #C8D0E0; --white: #FFFFFF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); color: var(--text); font-size: 18px; }
  nav { background: var(--surface); border-bottom: 1px solid var(--border); padding: 18px 32px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
  .nav-title { color: var(--white); font-size: 22px; font-weight: 700; letter-spacing: .3px; cursor: pointer; text-decoration: none; }
  .nav-title span { color: var(--muted); font-weight: 400; }
  .nav-links { display: flex; gap: 8px; }
  .nav-links a { color: var(--green); text-decoration: none; font-size: 16px; padding: 8px 16px; border-radius: 4px; border: 1px solid rgba(46,204,113,.3); transition: all .15s; }
  .nav-links a:hover { background: var(--green-dim); border-color: var(--green); }
  .nav-links a.active { background: var(--green-dim); border-color: var(--green); }
  .updated { color: var(--muted2); font-size: 15px; }
  .container { max-width: 1200px; margin: 0 auto; padding: 32px 28px; }
  .section-hdr { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .section-hdr h2 { font-size: 22px; font-weight: 700; color: var(--text); }
  .section-hdr .count { background: var(--surface3); color: var(--muted); font-size: 14px; font-weight: 700; padding: 4px 12px; border-radius: 10px; }
  .tasks-table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
  .tasks-table th { background: var(--surface2); color: var(--muted); text-align: left; padding: 16px 20px; font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; border-bottom: 1px solid var(--border); }
  .tasks-table td { padding: 28px 20px; border-bottom: 1px solid var(--border); font-size: 17px; vertical-align: middle; color: var(--text); line-height: 1.3; }
  .tasks-table tr:last-child td { border-bottom: none; }
  .tasks-table tr:hover td { background: var(--surface2); }
  .tasks-table tr.drag-over td { background: var(--accent-dim); border-top: 2px solid var(--accent); }
  .drag-handle { cursor: grab; color: var(--muted2); font-size: 20px; padding: 0 8px; user-select: none; line-height: 1; }
  .drag-handle:active { cursor: grabbing; }
  .owner-mike { background: var(--accent-dim); color: var(--accent); padding: 5px 14px; border-radius: 10px; font-size: 15px; font-weight: 600; white-space: nowrap; }
  .owner-art { background: #2D1A4A; color: #B07EE8; padding: 5px 14px; border-radius: 10px; font-size: 15px; font-weight: 600; white-space: nowrap; }
  .owner-momentum { background: var(--green-badge); color: var(--green); padding: 5px 14px; border-radius: 10px; font-size: 15px; font-weight: 600; white-space: nowrap; }
  .task-done { text-decoration: line-through; color: var(--muted2); }
  .task-check { appearance: none; -webkit-appearance: none; width: 26px; height: 26px; border: 2px solid var(--border); border-radius: 6px; background: transparent; cursor: pointer; position: relative; flex-shrink: 0; transition: all .15s; }
  .task-check:hover { border-color: var(--green); }
  .task-check:checked { background: var(--green); border-color: var(--green); }
  .task-check:checked::after { content: '✓'; position: absolute; top: 1px; left: 4px; font-size: 16px; color: #0D3320; font-weight: 700; }
  .task-notes { width: 100%; background: transparent; border: 1px solid transparent; border-radius: 5px; color: var(--muted); font-size: 16px; font-family: inherit; padding: 8px 10px; resize: none; min-height: 60px; line-height: 1.3; transition: border-color .15s, background .15s; overflow: hidden; box-sizing: border-box; }
  .task-tasktext { font-size: 17px; font-weight: 500; }
  .task-notes:hover { border-color: var(--border); background: var(--surface2); }
  .task-notes:focus { outline: none; border-color: var(--green); background: var(--surface2); color: var(--text); }
  .task-notes::placeholder { color: var(--muted2); font-style: italic; }
  .local-badge { font-size: 10px; background: var(--amber-dim); color: var(--amber); border-radius: 8px; padding: 1px 6px; margin-left: 6px; font-weight: 600; vertical-align: middle; }
  .btn-delete-task { background: none; border: none; color: var(--muted2); cursor: pointer; font-size: 14px; padding: 0 4px; line-height: 1; transition: color .15s; }
  .btn-delete-task:hover { color: var(--red); }
  .btn-new-task { background: var(--green-dim); color: var(--green); border: 1.5px solid var(--green); border-radius: 6px; padding: 10px 22px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all .15s; display: flex; align-items: center; gap: 6px; }
  .btn-new-task:hover { background: var(--green); color: #0D3320; }
  .btn-new-task::before { content: '+'; font-size: 20px; line-height: 1; }
  .btn-archive { background: transparent; color: var(--muted); border: 1.5px solid var(--border); border-radius: 6px; padding: 10px 22px; font-size: 16px; font-weight: 600; cursor: pointer; text-decoration: none; transition: all .15s; display: flex; align-items: center; gap: 6px; margin-left: auto; }
  .btn-archive:hover { border-color: var(--amber); color: var(--amber); }
  .btn-archive::before { content: '📦'; font-size: 15px; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 999; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; width: 100%; max-width: 520px; padding: 28px; box-shadow: 0 20px 60px rgba(0,0,0,.6); transform: translateY(16px); transition: transform .2s; }
  .modal-overlay.open .modal { transform: translateY(0); }
  .modal h3 { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 20px; }
  .form-row { margin-bottom: 14px; }
  .form-row label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
  .form-row input, .form-row textarea, .form-row select { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 14px; padding: 9px 12px; font-family: inherit; transition: border-color .15s; }
  .form-row input:focus, .form-row textarea:focus, .form-row select:focus { outline: none; border-color: var(--green); }
  .form-row textarea { resize: vertical; min-height: 70px; }
  .form-row select option { background: var(--surface2); }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
  .btn-cancel { background: transparent; border: 1px solid var(--border); color: var(--muted); border-radius: 6px; padding: 8px 18px; font-size: 14px; cursor: pointer; transition: all .15s; }
  .btn-cancel:hover { border-color: var(--muted); color: var(--text); }
  .btn-save { background: var(--green); border: none; color: #0D3320; border-radius: 6px; padding: 8px 20px; font-size: 14px; font-weight: 700; cursor: pointer; transition: background .15s; }
  .btn-save:hover { background: #25b362; }
  footer { text-align: center; padding: 24px; color: var(--muted2); font-size: 12px; border-top: 1px solid var(--border); margin-top: 12px; background: var(--surface); }
  @media(max-width: 600px) { nav { padding: 12px 16px; } .container { padding: 16px; } .tasks-table th, .tasks-table td { padding: 9px 11px; font-size: 13px; } }
</style>
</head>
<body>
<nav>
  <a href="index.html" class="nav-title" style="text-decoration:none;color:var(--white)">Mortell-Miller <span>Collab Notebook</span></a>
  <div style="display:flex;align-items:center;gap:20px">
    <div class="nav-links">
      <a href="tasks.html" class="active">Tasks</a>
      <a href="momentum.html">★ Momentum</a>
      <a href="ideas.html">Ideas</a>
      <a href="people.html">People</a>
      <a href="docs.html">Docs</a>
    </div>
    <div class="updated"><span id="pageDate"></span></div>
  </div>
</nav>

<div class="container">

  <!-- MODAL -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h3>New Task</h3>
      <div class="form-row">
        <label>Task</label>
        <textarea id="f-task" placeholder="Describe the task..."></textarea>
      </div>
      <div class="form-grid">
        <div class="form-row">
          <label>Owner</label>
          <select id="f-owner">
            <option value="mike">Mike</option>
            <option value="art">Art</option>
            <option value="momentum">Momentum</option>
          </select>
        </div>
        <div class="form-row">
          <label>Priority</label>
          <select id="f-priority">
            <option value="high">High</option>
            <option value="med">Medium</option>
            <option value="low">Low</option>
          </select>
        </div>
      </div>
      <div class="form-grid">
        <div class="form-row">
          <label>Due</label>
          <input id="f-due" type="text" placeholder="e.g. Mon June 2">
        </div>
        <div class="form-row">
          <label>Context</label>
          <input id="f-context" type="text" placeholder="Optional notes">
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" id="modalCancel">Cancel</button>
        <button class="btn-save" id="modalSave">Add Task</button>
      </div>
    </div>
  </div>

  <div class="section-hdr">
    <h2>Tasks &amp; Assignments</h2>
    <span class="count" id="taskCount"></span>
    <button class="btn-new-task" id="openModal">New Task</button>
    <span id="saveStatus" style="font-size:14px;color:var(--green);margin-left:8px"></span>
    <a href="archive.html" class="btn-archive">Archive</a>
  </div>
  <table class="tasks-table">
    <thead>
      <tr>
        <th style="width:32px"></th>
        <th style="width:44px"></th>
        <th>Task</th>
        <th>Notes</th>
        <th>Context</th>
      </tr>
    </thead>
    <tbody id="tasksBody"></tbody>
  </table>
</div>

<footer>Mortell-Miller Collab Notebook &nbsp;·&nbsp; Updated via GitHub &nbsp;·&nbsp; Private</footer>

<script>
// ── Firebase config ─────────────────────────────────────
const DB_URL = 'https://mortell-miller-web-site-default-rtdb.firebaseio.com/tasks.json';

const INITIAL_TASKS = [
  { priority:"high", task:"Prepare structured onboarding interview questions for Art", owner:"mike", context:"On camera or recorded. Art said 'I'm ready.' Feeds Legacy AI knowledge system.", notes:"", done:false },
  { priority:"high", task:"Arts tapes have been ID as Umatic. Mike talked with ED at LA video transfer in Pasadena. Next step: get tapes to LA VID TRANSFER", owner:"mike", context:"", notes:"", done:false },
  { priority:"high", task:"Email Art: 1-paragraph concept for Idea #1 (Art's Methodology for AI Learning) + title", owner:"mike", context:"Draft tonight, sleep on it, revise in morning", notes:"", done:false },
  { priority:"high", task:"Email Art: forward the AI-generated Art Mortell thesis summary", owner:"mike", context:"Cut & paste from Claude session output", notes:"", done:false },
  { priority:"high", task:"Contact Danielle — transparency note before any Jack-related action", owner:"mike", context:"Art & Mike side projects must be disclosed; clear separation from Jack track", notes:"", done:false },
  { priority:"high", task:"Locate beta machine for 1975 tape transfer", owner:"mike", context:"Art says Ronnie couldn't find one — Mike says he can. Tape 8 is first test.", notes:"", done:false },
  { priority:"high", task:"Send bio to Art (formal PDF + casual bio)", owner:"mike", context:"Sent May 31", notes:"", done:true },
];

let tasks = [];

async function loadTasks() {
  document.getElementById('tasksBody').innerHTML = '<tr><td colspan="5" style="text-align:center;padding:32px;color:var(--muted2);font-size:16px">Loading...</td></tr>';
  try {
    const res = await fetch(DB_URL);
    const data = await res.json();
    if (data === null) {
      // First load — seed Firebase with initial tasks
      tasks = INITIAL_TASKS;
      await saveTasks(true);
    } else {
      tasks = Array.isArray(data) ? data : Object.values(data);
    }
  } catch(e) {
    tasks = INITIAL_TASKS;
  }
  renderTasks();
}

async function saveTasks(silent) {
  if (!silent) setSaveStatus('Saving...');
  try {
    await fetch(DB_URL, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(tasks)
    });
    if (!silent) setSaveStatus('Saved ✓');
  } catch(e) {
    if (!silent) setSaveStatus('Save failed ✗');
  }
}

function setSaveStatus(msg) {
  const el = document.getElementById('saveStatus');
  if (el) { el.textContent = msg; clearTimeout(el._t); el._t = setTimeout(() => el.textContent = '', 3000); }
}

function toggleComplete(idx) {
  tasks[idx].done = true;
  saveTasks();
  renderTasks();
}

function deleteTask(idx) {
  tasks.splice(idx, 1);
  saveTasks();
  renderTasks();
}

function renderTasks() {
  const tb = document.getElementById('tasksBody');
  tb.innerHTML = '';
  const open = tasks.map((t,i) => ({...t, _i:i})).filter(t => !t.done);
  const done  = tasks.map((t,i) => ({...t, _i:i})).filter(t => t.done);
  document.getElementById('taskCount').textContent = open.length + ' open' + (done.length ? ` · ${done.length} archived` : '');

  open.forEach(t => {
    const oc = {mike:'owner-mike',art:'owner-art',momentum:'owner-momentum'}[t.owner]||'owner-mike';
    const ol = {mike:'Mike',art:'Art',momentum:'Momentum'}[t.owner]||t.owner;
    tb.innerHTML += `<tr draggable="true" data-idx="${t._i}">
      <td style="text-align:center;padding:0 4px;width:32px">
        <span class="drag-handle" title="Drag to reorder">⠿</span>
      </td>
      <td style="text-align:center;padding-left:4px;width:44px">
        <input type="checkbox" class="task-check" onchange="toggleComplete(${t._i})">
      </td>
      <td style="padding:10px 14px">
        <textarea class="task-notes task-tasktext" data-idx="${t._i}">${t.task||''}</textarea>
      </td>
      <td style="padding:10px 14px;min-width:280px">
        <textarea class="task-notes" data-idx="${t._i}" data-field="notes" placeholder="Add notes...">${t.notes||''}</textarea>
      </td>
      <td style="padding:10px 14px;min-width:140px">
        <div style="display:flex;align-items:flex-start;gap:6px">
          <textarea class="task-notes task-context" data-idx="${t._i}" data-field="context" placeholder="Add context...">${t.context||''}</textarea>
          <button class="btn-delete-task" onclick="deleteTask(${t._i})">✕</button>
        </div>
      </td>
    </tr>`;
  });

  function autoExpand(el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }

  tb.querySelectorAll('.task-tasktext').forEach(el => {
    autoExpand(el);
    el.addEventListener('blur', () => { tasks[el.dataset.idx].task = el.value; saveTasks(); });
    el.addEventListener('input', () => autoExpand(el));
  });
  tb.querySelectorAll('[data-field="notes"]').forEach(el => {
    autoExpand(el);
    el.addEventListener('blur', () => { tasks[el.dataset.idx].notes = el.value; saveTasks(); });
    el.addEventListener('input', () => autoExpand(el));
  });
  tb.querySelectorAll('[data-field="context"]').forEach(el => {
    autoExpand(el);
    el.addEventListener('blur', () => { tasks[el.dataset.idx].context = el.value; saveTasks(); });
    el.addEventListener('input', () => autoExpand(el));
  });

  // Drag-and-drop reordering
  let dragIdx = null;
  tb.querySelectorAll('tr[draggable]').forEach(row => {
    row.addEventListener('dragstart', e => {
      dragIdx = parseInt(row.dataset.idx);
      row.style.opacity = '0.4';
      e.dataTransfer.effectAllowed = 'move';
    });
    row.addEventListener('dragend', () => {
      row.style.opacity = '';
      tb.querySelectorAll('tr').forEach(r => r.classList.remove('drag-over'));
    });
    row.addEventListener('dragover', e => {
      e.preventDefault();
      tb.querySelectorAll('tr').forEach(r => r.classList.remove('drag-over'));
      row.classList.add('drag-over');
    });
    row.addEventListener('drop', e => {
      e.preventDefault();
      const dropIdx = parseInt(row.dataset.idx);
      if (dragIdx === null || dragIdx === dropIdx) return;
      // Reorder within the open tasks
      const open = tasks.map((t,i) => ({...t, _i:i})).filter(t => !t.done);
      const dragItem = open.find(t => t._i === dragIdx);
      const dropItem = open.find(t => t._i === dropIdx);
      if (!dragItem || !dropItem) return;
      // Swap positions in the tasks array
      const di = tasks.indexOf(tasks[dragIdx]);
      const ti = tasks.indexOf(tasks[dropIdx]);
      [tasks[di], tasks[ti]] = [tasks[ti], tasks[di]];
      saveTasks();
      renderTasks();
    });
  });
}

loadTasks();

const overlay = document.getElementById('modalOverlay');
document.getElementById('openModal').onclick = () => overlay.classList.add('open');
document.getElementById('modalCancel').onclick = () => overlay.classList.remove('open');
overlay.addEventListener('click', e => { if(e.target===overlay) overlay.classList.remove('open'); });
document.getElementById('modalSave').onclick = () => {
  const task = document.getElementById('f-task').value.trim();
  if (!task) { document.getElementById('f-task').focus(); return; }
  tasks.push({
    priority: document.getElementById('f-priority').value,
    task,
    owner: document.getElementById('f-owner').value,
    context: document.getElementById('f-context').value.trim(),
    notes: '',
    done: false
  });
  saveTasks();
  renderTasks();
  overlay.classList.remove('open');
  ['f-task','f-context'].forEach(id => document.getElementById(id).value='');
  document.getElementById('f-priority').value='high';
  document.getElementById('f-owner').value='mike';
};
</script>
<script>document.addEventListener("DOMContentLoaded",function(){var el=document.getElementById("pageDate");if(el)el.textContent="Updated "+new Date().toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"});});</script>
</body>
</html>
