<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tasks — Mortell-Miller</title>
<style>
  :root {
    --bg: #0E1117; --surface: #161B27; --surface2: #1E2535; --surface3: #252D40;
    --accent: #4A9EDB; --accent-dim: #1D3A57;
    --green: #2ECC71; --green-dim: #0D3320; --green-badge: #163D25;
    --amber: #F0A500; --amber-dim: #3A2800;
    --red: #E05252; --red-dim: #3A1010;
    --border: #2A3248; --text: #E8ECF4; --muted: #E8ECF4; --muted2: #C8D0E0; --white: #FFFFFF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); color: var(--text); font-size: 15px; }
  nav { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 32px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
  .nav-title { color: var(--white); font-size: 18px; font-weight: 700; letter-spacing: .3px; cursor: pointer; text-decoration: none; }
  .nav-title span { color: var(--muted); font-weight: 400; }
  .nav-links { display: flex; gap: 6px; }
  .nav-links a { color: var(--green); text-decoration: none; font-size: 13px; padding: 5px 12px; border-radius: 4px; border: 1px solid rgba(46,204,113,.3); transition: all .15s; }
  .nav-links a:hover { background: var(--green-dim); border-color: var(--green); }
  .nav-links a.active { background: var(--green-dim); border-color: var(--green); }
  .updated { color: var(--muted2); font-size: 12px; }
  .container { max-width: 1100px; margin: 0 auto; padding: 28px 24px; }
  .section-hdr { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .section-hdr h2 { font-size: 16px; font-weight: 700; color: var(--text); }
  .section-hdr .count { background: var(--surface3); color: var(--muted); font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; }
  .tasks-table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
  .tasks-table th { background: var(--surface2); color: var(--muted); text-align: left; padding: 11px 16px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; border-bottom: 1px solid var(--border); }
  .tasks-table td { padding: 11px 16px; border-bottom: 1px solid var(--border); font-size: 14px; vertical-align: top; color: var(--text); }
  .tasks-table tr:last-child td { border-bottom: none; }
  .tasks-table tr:hover td { background: var(--surface2); }
  .owner-mike { background: var(--accent-dim); color: var(--accent); padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .owner-art { background: #2D1A4A; color: #B07EE8; padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .owner-momentum { background: var(--green-badge); color: var(--green); padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .due-urgent { color: var(--red); font-weight: 700; font-size: 13px; }
  .due-soon { color: var(--amber); font-weight: 600; font-size: 13px; }
  .due-normal { color: var(--muted); font-size: 13px; }
  .task-done { text-decoration: line-through; color: var(--muted2); }
  .task-check { appearance: none; -webkit-appearance: none; width: 16px; height: 16px; border: 1.5px solid var(--border); border-radius: 4px; background: transparent; cursor: pointer; position: relative; flex-shrink: 0; transition: all .15s; }
  .task-check:hover { border-color: var(--green); }
  .task-check:checked { background: var(--green); border-color: var(--green); }
  .task-check:checked::after { content: '✓'; position: absolute; top: -1px; left: 2px; font-size: 11px; color: #0D3320; font-weight: 700; }
  .task-notes { width: 100%; background: transparent; border: 1px solid transparent; border-radius: 5px; color: var(--muted); font-size: 13px; font-family: inherit; padding: 4px 7px; resize: none; min-height: 36px; line-height: 1.5; transition: border-color .15s, background .15s; overflow: hidden; }
  .task-notes:hover { border-color: var(--border); background: var(--surface2); }
  .task-notes:focus { outline: none; border-color: var(--green); background: var(--surface2); color: var(--text); }
  .task-notes::placeholder { color: var(--muted2); font-style: italic; }
  .local-badge { font-size: 10px; background: var(--amber-dim); color: var(--amber); border-radius: 8px; padding: 1px 6px; margin-left: 6px; font-weight: 600; vertical-align: middle; }
  .btn-delete-task { background: none; border: none; color: var(--muted2); cursor: pointer; font-size: 14px; padding: 0 4px; line-height: 1; transition: color .15s; }
  .btn-delete-task:hover { color: var(--red); }
  .btn-new-task { background: var(--green-dim); color: var(--green); border: 1.5px solid var(--green); border-radius: 6px; padding: 5px 14px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s; display: flex; align-items: center; gap: 5px; }
  .btn-new-task:hover { background: var(--green); color: #0D3320; }
  .btn-new-task::before { content: '+'; font-size: 16px; line-height: 1; }
  .btn-archive { background: transparent; color: var(--muted); border: 1.5px solid var(--border); border-radius: 6px; padding: 5px 14px; font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none; transition: all .15s; display: flex; align-items: center; gap: 5px; margin-left: auto; }
  .btn-archive:hover { border-color: var(--amber); color: var(--amber); }
  .btn-archive::before { content: '📦'; font-size: 13px; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 999; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; width: 100%; max-width: 520px; padding: 28px; box-shadow: 0 20px 60px rgba(0,0,0,.6); transform: translateY(16px); transition: transform .2s; }
  .modal-overlay.open .modal { transform: translateY(0); }
  .modal h3 { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 20px; }
  .form-row { margin-bottom: 14px; }
  .form-row label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
  .form-row input, .form-row textarea, .form-row select { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 14px; padding: 9px 12px; font-family: inherit; transition: border-color .15s; }
  .form-row input:focus, .form-row textarea:focus, .form-row select:focus { outline: none; border-color: var(--green); }
  .form-row textarea { resize: vertical; min-height: 70px; }
  .form-row select option { background: var(--surface2); }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
  .btn-cancel { background: transparent; border: 1px solid var(--border); color: var(--muted); border-radius: 6px; padding: 8px 18px; font-size: 14px; cursor: pointer; transition: all .15s; }
  .btn-cancel:hover { border-color: var(--muted); color: var(--text); }
  .btn-save { background: var(--green); border: none; color: #0D3320; border-radius: 6px; padding: 8px 20px; font-size: 14px; font-weight: 700; cursor: pointer; transition: background .15s; }
  .btn-save:hover { background: #25b362; }
  footer { text-align: center; padding: 24px; color: var(--muted2); font-size: 12px; border-top: 1px solid var(--border); margin-top: 12px; background: var(--surface); }
  @media(max-width: 600px) { nav { padding: 12px 16px; } .container { padding: 16px; } .tasks-table th, .tasks-table td { padding: 9px 11px; font-size: 13px; } }
</style>
</head>
<body>
<nav>
  <a href="index.html" class="nav-title" style="text-decoration:none;color:var(--white)">Mortell-Miller <span>Collab Notebook</span></a>
  <div style="display:flex;align-items:center;gap:20px">
    <div class="nav-links">
      <a href="tasks.html" class="active">Tasks</a>
      <a href="momentum.html">★ Momentum</a>
      <a href="ideas.html">Ideas</a>
      <a href="people.html">People</a>
      <a href="docs.html">Docs</a>
    </div>
    <div class="updated">Updated May 31, 2026</div>
  </div>
</nav>

<div class="container">

  <!-- MODAL -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h3>New Task</h3>
      <div class="form-row">
        <label>Task</label>
        <textarea id="f-task" placeholder="Describe the task..."></textarea>
      </div>
      <div class="form-grid">
        <div class="form-row">
          <label>Owner</label>
          <select id="f-owner">
            <option value="mike">Mike</option>
            <option value="art">Art</option>
            <option value="momentum">Momentum</option>
          </select>
        </div>
        <div class="form-row">
          <label>Priority</label>
          <select id="f-priority">
            <option value="high">High</option>
            <option value="med">Medium</option>
            <option value="low">Low</option>
          </select>
        </div>
      </div>
      <div class="form-grid">
        <div class="form-row">
          <label>Due</label>
          <input id="f-due" type="text" placeholder="e.g. Mon June 2">
        </div>
        <div class="form-row">
          <label>Context</label>
          <input id="f-context" type="text" placeholder="Optional notes">
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" id="modalCancel">Cancel</button>
        <button class="btn-save" id="modalSave">Add Task</button>
      </div>
    </div>
  </div>

  <div class="section-hdr">
    <h2>Tasks &amp; Assignments</h2>
    <span class="count" id="taskCount"></span>
    <button class="btn-new-task" id="openModal">New Task</button>
    <a href="archive.html" class="btn-archive">Archive</a>
  </div>
  <table class="tasks-table">
    <thead>
      <tr>
        <th style="width:36px"></th>
        <th>Task</th>
        <th>Owner</th>
        <th>Notes</th>
        <th>Context</th>
      </tr>
    </thead>
    <tbody id="tasksBody"></tbody>
  </table>
</div>

<footer>Mortell-Miller Collab Notebook &nbsp;·&nbsp; Updated via GitHub &nbsp;·&nbsp; Private</footer>

<script>
const DATA_TASKS = [
  { priority: "high", task: "Email Art: 1-paragraph concept for Idea #1 (Art's Methodology for AI Learning) + title", owner: "mike", due: "Sun June 1", context: "Draft tonight, sleep on it, revise in morning", done: false },
  { priority: "high", task: "Email Art: forward the AI-generated Art Mortell thesis summary", owner: "mike", due: "Sun June 1", context: "Cut & paste from Claude session output", done: false },
  { priority: "high", task: "Contact Danielle — transparency note before any Jack-related action", owner: "mike", due: "Before Fri June 5", context: "Art & Mike side projects must be disclosed; clear separation from Jack track", done: false },
  { priority: "high", task: "Locate beta machine for 1975 tape transfer", owner: "mike", due: "Mon June 2", context: "Art says Ronnie couldn't find one — Mike says he can. Tape 8 is first test.", done: false },
  { priority: "high", task: "Send bio to Art (formal PDF + casual bio)", owner: "mike", due: "Done ✓", context: "Sent May 31", done: true },
  { priority: "med", task: "Send photos of beta tape 8 case and packaging", owner: "art", due: "Soon", context: "Via Catalina's email — Art has all 8 tapes in physical possession", done: false },
  { priority: "med", task: "Read one narrative/chapter from Art's book per night; take notes on extraction candidates", owner: "mike", due: "Ongoing", context: "Art pointed Mike to Anthony Barton's narrative first. Notes feed the AI knowledge system.", done: false },
  { priority: "med", task: "Watch 5-minute Anthony Barton / Sierra Leone documentary trailer", owner: "mike", due: "This week", context: "Art emailed it. Form view on whether/how to reignite the Blair Underwood / Damascus / Amazon project.", done: false },
  { priority: "med", task: "Research Damascus Productions (Heather & Ryan O'Quinn)", owner: "mike", due: "This week", context: "Faith-based film company, Westlake/Burbank, subsidiary of Simonds. Check with boss Chris — possible prior relationship.", done: false },
  { priority: "med", task: "Create partnership architecture sketch to bring to lunch", owner: "mike", due: "Before lunch", context: "Art's request: the spokes, the model, the atoms. Compensation baked in. Done — v2 filed.", done: true },
  { priority: "med", task: "Prepare structured onboarding interview questions for Art", owner: "mike", due: "This week", context: "On camera or recorded. Art said 'I'm ready.' Feeds Legacy AI knowledge system.", done: false },
  { priority: "med", task: "Brief Jack informally before any group meeting", owner: "momentum", due: "Before Fri June 5", context: "Danielle & Allison to approach Jack first. Mike available for face-to-face when Jack is ready.", done: false },
  { priority: "low", task: "Schedule lunch — Luna Grill or Cheesecake Factory", owner: "mike", due: "Tue or Wed this week", context: "Art has dental Mon, grandson Tue lunch — Wednesday most likely. 1 hour min to finish 20-idea list.", done: false },
  { priority: "low", task: "Strategize Jerry Cox contact approach with Art before reaching out", owner: "mike", due: "At lunch", context: "Jerry Cox (612-327-6190) — Total Training Network videos of Art in the cloud. Do not call yet.", done: false },
];

const LOCAL_KEY = 'mm_hub_tasks';
const NOTES_KEY = 'mm_hub_notes';
const CONTEXT_KEY = 'mm_hub_context';
const TASKTEXT_KEY = 'mm_hub_tasktext';
const COMPLETE_KEY = 'mm_hub_complete';

function getLocalTasks() {
  try { return (JSON.parse(localStorage.getItem(LOCAL_KEY) || '[]')).map((t,i) => ({...t, _local:true, _idx:i})); }
  catch(e) { return []; }
}
function saveLocalTasks(arr) { localStorage.setItem(LOCAL_KEY, JSON.stringify(arr)); }
function getAllNotes() { try { return JSON.parse(localStorage.getItem(NOTES_KEY) || '{}'); } catch(e) { return {}; } }
function saveNote(k, v) { const n = getAllNotes(); n[k] = v; localStorage.setItem(NOTES_KEY, JSON.stringify(n)); }
function getAllContexts() { try { return JSON.parse(localStorage.getItem(CONTEXT_KEY) || '{}'); } catch(e) { return {}; } }
function saveContext(k, v) { const c = getAllContexts(); c[k] = v; localStorage.setItem(CONTEXT_KEY, JSON.stringify(c)); }
function getAllTaskTexts() { try { return JSON.parse(localStorage.getItem(TASKTEXT_KEY) || '{}'); } catch(e) { return {}; } }
function saveTaskText(k, v) { const tt = getAllTaskTexts(); tt[k] = v; localStorage.setItem(TASKTEXT_KEY, JSON.stringify(tt)); }
function getCompleted() { try { return JSON.parse(localStorage.getItem(COMPLETE_KEY) || '{}'); } catch(e) { return {}; } }
function setCompleted(k, v) { const c = getCompleted(); c[k] = v; localStorage.setItem(COMPLETE_KEY, JSON.stringify(c)); }

function toggleComplete(key, isLocal, localIdx) {
  const c = getCompleted(); const nowDone = !c[key];
  setCompleted(key, nowDone);
  if (isLocal) { const arr = JSON.parse(localStorage.getItem(LOCAL_KEY)||'[]'); if(arr[localIdx]){arr[localIdx].done=nowDone; saveLocalTasks(arr);} }
  renderTasks();
}

function renderTasks() {
  const tb = document.getElementById('tasksBody'); tb.innerHTML = '';
  const all = [...DATA_TASKS, ...getLocalTasks()];
  const completed = getCompleted(); const notes = getAllNotes(); const contexts = getAllContexts(); const taskTexts = getAllTaskTexts();
  const resolved = all.map((t,i) => { const k = t._local?'local_'+t._idx:'task_'+i; return {...t, _key:k, _done: t.done||!!completed[k]}; });
  const open = resolved.filter(t=>!t._done); const done = resolved.filter(t=>t._done);
  document.getElementById('taskCount').textContent = open.length + ' open' + (done.length ? ` · ${done.length} archived` : '');
  open.forEach(t => {
    const oc = {mike:'owner-mike',art:'owner-art',momentum:'owner-momentum'}[t.owner]||'owner-mike';
    const ol = {mike:'Mike',art:'Art',momentum:'Momentum'}[t.owner]||t.owner;
    const dc = t._done?'due-normal':(t.due&&(t.due.includes('Sun')||t.due.includes('Mon'))?'due-urgent':t.due&&t.due.includes('Fri')?'due-soon':'due-normal');
    const isLocal = !!t._local; const li = isLocal?t._idx:-1;
    const del = isLocal?`<button class="btn-delete-task" onclick="deleteLocalTask(${li})">✕</button>`:'';
    const badge = isLocal?`<span class="local-badge">local</span>`:'';
    const savedNote = notes[t._key]||'';
    const savedContext = contexts[t._key] !== undefined ? contexts[t._key] : (t.context||'');
    const savedTaskText = taskTexts[t._key] !== undefined ? taskTexts[t._key] : (t.task||'');
    tb.innerHTML += `<tr>
      <td style="text-align:center;padding-left:14px"><input type="checkbox" class="task-check" onchange="toggleComplete('${t._key}',${isLocal},${li})"></td>
      <td style="padding:6px 10px"><textarea class="task-notes task-tasktext" data-key="${t._key}" rows="2">${savedTaskText}</textarea>${badge}</td>
      <td><span class="${oc}">${ol}</span></td>
      <td style="padding:6px 10px;min-width:280px"><textarea class="task-notes" data-key="${t._key}" placeholder="Add notes..." rows="2">${savedNote}</textarea></td>
      <td style="padding:6px 10px;min-width:140px"><div style="display:flex;align-items:flex-start;gap:6px"><textarea class="task-notes task-context" data-key="${t._key}" placeholder="Add context..." rows="2">${savedContext}</textarea>${del}</div></td>
    </tr>`;
  });
  tb.querySelectorAll('.task-notes:not(.task-context)').forEach(el => {
    el.addEventListener('blur', () => saveNote(el.dataset.key, el.value));
    el.addEventListener('input', () => { el.style.height='auto'; el.style.height=el.scrollHeight+'px'; });
  });
  tb.querySelectorAll('.task-context').forEach(el => {
    el.addEventListener('blur', () => saveContext(el.dataset.key, el.value));
    el.addEventListener('input', () => { el.style.height='auto'; el.style.height=el.scrollHeight+'px'; });
  });
  tb.querySelectorAll('.task-tasktext').forEach(el => {
    el.addEventListener('blur', () => saveTaskText(el.dataset.key, el.value));
    el.addEventListener('input', () => { el.style.height='auto'; el.style.height=el.scrollHeight+'px'; });
  });
}

function deleteLocalTask(idx) { const arr=getLocalTasks(); arr.splice(idx,1); saveLocalTasks(arr); renderTasks(); }
renderTasks();

const overlay = document.getElementById('modalOverlay');
document.getElementById('openModal').onclick = () => overlay.classList.add('open');
document.getElementById('modalCancel').onclick = () => overlay.classList.remove('open');
overlay.addEventListener('click', e => { if(e.target===overlay) overlay.classList.remove('open'); });
document.getElementById('modalSave').onclick = () => {
  const task = document.getElementById('f-task').value.trim();
  if (!task) { document.getElementById('f-task').focus(); return; }
  const arr = JSON.parse(localStorage.getItem(LOCAL_KEY)||'[]');
  arr.push({ priority: document.getElementById('f-priority').value, task, owner: document.getElementById('f-owner').value, due: document.getElementById('f-due').value.trim()||'TBD', context: document.getElementById('f-context').value.trim(), done: false });
  saveLocalTasks(arr); renderTasks(); overlay.classList.remove('open');
  ['f-task','f-due','f-context'].forEach(id => document.getElementById(id).value='');
  document.getElementById('f-priority').value='high'; document.getElementById('f-owner').value='mike';
};
</script>
</body>
</html>
